<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Live Navigation Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .control-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 320px;
            max-width: calc(100vw - 40px);
        }
        .control-panel input, .control-panel select, .control-panel button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .control-panel button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .control-panel button:hover {
            background-color: #0056b3;
        }
        #instructions-container {
            background: #f9f9f9;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            max-height: 140px;
            overflow-y: auto;
            font-size: 13px;
            border: 1px solid #ddd;
        }
        #instructions-list {
            padding-left: 15px;
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <h3 style="margin: 0 0 10px 0; font-size: 16px; color: #333;">Live Navigation</h3>
        <input type="text" id="start-loc" placeholder="Start Location (Optional, default GPS)" value="">
        <input type="text" id="end-loc" placeholder="Destination (e.g., Delhi)" value="Mumbai">
        
        <select id="transport-mode">
            <option value="driving">Car / Driving</option>
            <option value="walking">Walking</option>
            <option value="cycling">Cycling</option>
        </select>

        <button onclick="startNavigation()">Start Navigation</button>
        <button onclick="panToMyLocation()" style="background-color: #28a745;">My Location</button>

        <div id="instructions-container">
            <b>Directions:</b>
            <ul id="instructions-list">
                <li>Destination enter karke Start Navigation dabayein.</li>
            </ul>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Map initialize
        const map = L.map('map').setView([20.5937, 78.9629], 5);

        // Standard OpenStreetMap Tiles
        const streetsLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let currentRouteLayer = null;
        let userMarker = null;

        // Voice Guidance function
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        // Get My Location function
        function panToMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    map.setView([lat, lon], 15);
                    
                    if (userMarker) {
                        userMarker.setLatLng([lat, lon]);
                    } else {
                        userMarker = L.marker([lat, lon]).addTo(map).bindPopup("Aap yahan hain!").openPopup();
                    }
                    speak("Aapki current location mil gayi hai.");
                }, error => {
                    alert("Location access denied or unavailable.");
                }, { enableHighAccuracy: true });
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }

        // Geocoding and Routing function
        async function startNavigation() {
            const startQuery = document.getElementById('start-loc').value;
            const endQuery = document.getElementById('end-loc').value;
            const mode = document.getElementById('transport-mode').value;

            if (!endQuery) {
                alert("Please enter a destination!");
                return;
            }

            let startCoords = null;

            if (startQuery.trim() !== "") {
                startCoords = await getCoordinates(startQuery);
            } else {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true });
                    });
                    startCoords = [pos.coords.longitude, pos.coords.latitude];
                } catch (e) {
                    alert("Start location nahi mili, please GPS on karein.");
                    return;
                }
            }

            const endCoords = await getCoordinates(endQuery);

            if (!startCoords || !endCoords) {
                alert("Location nahi mili. Sahi naam enter karein.");
                return;
            }

            getRoute(startCoords, endCoords, mode);
        }

        async function getCoordinates(query) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.length > 0) {
                    return [parseFloat(data[0].lon), parseFloat(data[0].lat)];
                }
            } catch (error) {
                console.error("Geocoding error:", error);
            }
            return null;
        }

        async function getRoute(start, end, mode) {
            let profile = 'driving';
            if (mode === 'walking') profile = 'foot';
            if (mode === 'cycling') profile = 'bike';

            const url = `https://router.project-osrm.org/route/v1/${profile}/${start[0]},${start[1]};${end[0]},${end[1]}?overview=full&geometries=geojson&steps=true`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

                    if (currentRouteLayer) {
                        map.removeLayer(currentRouteLayer);
                    }

                    currentRouteLayer = L.polyline(coords, { color: 'blue', weight: 6, opacity: 0.8 }).addTo(map);
                    map.fitBounds(currentRouteLayer.getBounds());

                    // Render turn-by-turn directions list
                    const instructionsList = document.getElementById('instructions-list');
                    instructionsList.innerHTML = '';

                    if (route.legs && route.legs[0].steps) {
                        route.legs[0].steps.forEach((step) => {
                            let li = document.createElement('li');
                            li.innerText = step.maneuver.instruction + ` (${Math.round(step.distance)}m)`;
                            instructionsList.appendChild(li);
                        });

                        if (route.legs[0].steps.length > 0) {
                            speak("Navigation shuru ho gayi hai. " + route.legs[0].steps[0].maneuver.instruction);
                        }
                    }
                } else {
                    alert("Route nahi mila.");
                }
            } catch (error) {
                console.error("Routing error:", error);
                alert("Routing fetch karne me error aayi.");
            }
        }
    </script>
</body>
</html>
